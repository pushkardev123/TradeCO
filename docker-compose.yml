name: tradeco-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${TRADECO_POSTGRES_DB:-tradeco}
      POSTGRES_USER: ${TRADECO_POSTGRES_USER:-tradeco}
      POSTGRES_PASSWORD: ${TRADECO_POSTGRES_PASSWORD:-tradeco_local_password}
    ports:
      - "${TRADECO_POSTGRES_PORT:-5432}:5432"
    volumes:
      - tradeco-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${TRADECO_REDIS_PORT:-6379}:6379"
    volumes:
      - tradeco-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tradeco-postgres-data:
  tradeco-redis-data:
